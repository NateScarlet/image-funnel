"应用元信息"
type Meta {
  "应用根目录的绝对路径"
  rootAbsPath: String!
  rootPath: String! @deprecated(reason: "use rootAbsPath")
  "当前应用版本号"
  version: String!
  "配置的基础URL"
  baseURL: String!
  "服务启动时间"
  serverStartTime: Time!
  "客户端上报用的 Sentry DSN。空串表示关闭上报；非空时可直接使用 SDK 默认 transport"
  sentryDsn: String!
  "加载耗时采样阈值（毫秒）。null 表示关闭性能上报，客户端不应发送性能事件"
  loadLatencyThresholdMs: Int
}