"""
目录节点，表示文件系统中的一个子目录。根目录的 relPath 为空字符串。
"""
type Directory implements Node
  @goModel(model: "main/internal/shared.DirectoryDTO") {
  id: ID!
  "上级目录ID，根目录此值为null"
  parentId: ID
  "相对根目录的路径"
  relPath: String!
  path: String! @deprecated(reason: "use relPath") @goField(name: "RelPath")
  "是否为根目录"
  root: Boolean!
  "目录统计信息（图片数量、子目录数、评分分布等）"
  stats: DirectoryStats
  "子目录列表"
  directories: [Directory!]!
    @deprecated(reason: "use directoriesV2")
    @goField(forceResolver: true)
  "子目录列表，支持筛选与分页"
  directoriesV2(
    filterBy: DirectoryFilters
    first: Int
    after: String
  ): DirectoryConnection! @goField(forceResolver: true)
  "目录下的图片列表，支持筛选与分页"
  images(
    filterBy: ImageFiltersInput
    first: Int
    after: String
  ): ImageConnection! @goField(forceResolver: true)
  "目录下的备忘录列表，支持筛选与分页"
  memos(filterBy: MemoFiltersInput, first: Int, after: String): MemoConnection!
    @goField(forceResolver: true)
  "该目录下最后活跃的会话，无历史会话时返回null"
  lastSession: Session @goField(forceResolver: true)
}

input DirectoryFilters
  @goModel(model: "main/internal/shared.DirectoryFilters") {
  """
  目录ID列表，为null表示订阅所有目录，空数组表示不订阅任何目录
  """
  id: [ID!]
}

type DirectoryConnection
  @goModel(model: "main/internal/shared.DirectoryConnectionDTO") {
  edges: [DirectoryEdge!]!
  nodes: [Directory!]!
  pageInfo: PageInfo!
}

type DirectoryEdge @goModel(model: "main/internal/shared.DirectoryEdgeDTO") {
  node: Directory!
  cursor: String!
}

type ImageConnection
  @goModel(model: "main/internal/shared.ImageConnectionDTO") {
  edges: [ImageEdge!]!
  nodes: [Image!]!
  pageInfo: PageInfo!
}

type ImageEdge @goModel(model: "main/internal/shared.ImageEdgeDTO") {
  node: Image!
  cursor: String!
}

type PageInfo @goModel(model: "main/internal/shared.PageInfoDTO") {
  "是否有下一页"
  hasNextPage: Boolean!
  "是否有上一页"
  hasPreviousPage: Boolean!
  "当前页起始游标，首页为null"
  startCursor: String
  "当前页结束游标，末页为null"
  endCursor: String
}
