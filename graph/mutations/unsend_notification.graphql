"撤回通知的输入参数"
input UnsendNotificationInput {
  "通知标签"
  tag: String!
  "客户端变更标识，用于幂等"
  clientMutationId: String
}

type UnsendNotificationPayload {
  "客户端变更标识，用于幂等"
  clientMutationId: String
}

extend type Mutation {
  """
  撤回（删除）指定通知。通知被删除后不可恢复。
  """
  unsendNotification(input: UnsendNotificationInput!): UnsendNotificationPayload!
}