"将符合条件的图片及其配套文件移到回收站"
input TrashImagesInput {
  directoryId: ID!
  filterBy: ImageFiltersInput!
  "删除时附带的额外说明消息，支持多行文本"
  message: String
  clientMutationId: String
}

type TrashImagesPayload {
  historyId: ID!
  movedCount: Int!
  clientMutationId: String
}

extend type Mutation {
  trashImages(input: TrashImagesInput!): TrashImagesPayload!
}
