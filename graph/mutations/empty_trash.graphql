"手动清空回收站"
type EmptyTrashPayload {
  "此次被真正清理的历史数量"
  clearedCount: Int!
  clientMutationId: String
}

input EmptyTrashInput {
  "最低存留期，仅清空早于该时间的记录"
  minAge: Duration!
  clientMutationId: String
}

extend type Mutation {
  "清空回收站中早于指定存留期 (Duration) 的历史记录"
  emptyTrash(input: EmptyTrashInput!): EmptyTrashPayload!
}
