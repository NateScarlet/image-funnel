"手动清空回收站"
type EmptyTrashPayload @goModel(model: "main/internal/shared.EmptyTrashResultDTO") {
  "此次被真正清理的历史数量"
  clearedCount: Int!
  "此次被真正清理的历史所释放的空间大小（字节数）。对每条被清理历史的元数据记录总大小求和（含图片本体与伴随文件），在异步物理擦除前读取"
  clearedSize: Int!
  clientMutationId: String
}

input EmptyTrashInput {
  "最低存留期，仅清空早于该时间的记录"
  minAge: Duration!
  clientMutationId: String
}

extend type Mutation {
  "清空回收站中早于指定存留期 (Duration) 的历史记录"
  emptyTrash(input: EmptyTrashInput!): EmptyTrashPayload!
}
