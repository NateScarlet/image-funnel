id = "branch"
name = "移动图片"
description = "即时运行 /branch 笔记指令"
command = "uv run runner.py branch"

[directive]
name = "branch"
usage = """
/branch [<suffix>]
将图片和配套文件移动到当前目录同级的目录，目录名称为 `当前目录名称,<suffix>` ，suffix 为可选（默认 TODO），根目录触发改为创建名称为 <suffix> 的子目录
"""
on_success_action = "REMOVE" # 成功后移除当前指令避免再次触发

[directive.autocomplete]
command = "uv run runner.py branch autocomplete"


[on.post_update_note]
ignore_directive = false # 为 true 时忽略 [directive] 约束（即使定义了指令，笔记中未含该指令也依然触发）

[env]
# DANBOORU_SEARCH_URL = "https://sakizuki-danboorusearch.hf.space" # Danbooru 标签在线语义搜索服务的地址，取消注释以启用标签补全。接口文档：https://sakizuki-danboorusearch.hf.space/api/openapi.json
# DANBOORU_SEARCH_INCLUDE_NSFW = "false" # Danbooru 标签搜索是否包含 NSFW 标签，默认为 false
# DANBOORU_DATA_DIR = "" # 本地 Danbooru 编译产物目录；缺省时默认 ${IMAGE_FUNNEL_DATA_DIR}/danbooru（仅当该目录已编译产物时启用）。先运行编译脚本（参数为源数据目录，产物自动写入补全读取路径）：uv run example_hooks/compile_danbooru_data.py <源数据目录>，设置后优先于 DANBOORU_SEARCH_URL
# HOOK_AUTOCOMPLETE_EMBEDDING_PROVIDER_URL = "http://localhost:1234#apiKey=&model=text-embedding-bge-m3&timeoutMs=3000" # Danbooru 语义层使用的 OpenAI 兼容 /v1/embeddings 端点；语法 <base>#apiKey=<k>&model=<m>&timeoutMs=<ms>，apiKey 为空则不发送 Authorization 头。仅在本地编译产物含标签向量时生效（否则补全退回纯字面匹配）
HOOK_IMAGE_SET_LABEL = "White"

