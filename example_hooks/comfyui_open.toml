id = "comfyui-open"
name = "在 ComfyUI 页面打开"
description = "把图片内嵌工作流直接送达最近打开的 ComfyUI 页面并打开，输出目录会调整为图片当前所在目录，无需复制粘贴"
command = "uv run runner.py comfyui.open_workflow"

[on.image_dispatch] # 手动派发：用户右键选中图片时触发

[env]
# COMFYUI_URL = ""        # ComfyUI 服务地址。默认 http://127.0.0.1:8188
# COMFYUI_OUTPUT_DIR = ""  # ComfyUI 的输出根目录。若未提供，自动为图片绝对路径中最后一个名为 output 的目录。显式提供时会校验图片及目标目录是否在其中。
# HOOK_OUTPUT_DIR = ""     # 覆盖目标输出目录。默认不指定时，输出到图片当前所在目录；指定相对路径时，该路径相对于 ComfyUI 的输出根目录；若设为绝对路径，则必须在输出根目录内部，否则报错；若设为 :inherit:，则原样打开未调整的工作流。