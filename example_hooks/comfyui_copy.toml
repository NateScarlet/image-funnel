id = "comfyui-copy"
name = "复制 ComfyUI 工作流"
description = "复制图片时提取内置工作流，并将输出目录调整为图片当前所在目录；粘贴回 ComfyUI 后直接入队即可把新图生成到同一目录"
command = "uv run runner.py comfyui.copy_workflow"

[copy] # 声明复制增强能力：用户复制图片时同步调用本钩子的顶层 command，stdout 单行 JSON 信封即剪贴板内容

[env]
# COMFYUI_OUTPUT_DIR = ""  # ComfyUI 的输出根目录。若未提供，自动为图片绝对路径中最后一个名为 output 的目录。显式提供时会校验图片及目标目录是否在其中。
# HOOK_OUTPUT_DIR = ""     # 覆盖目标输出目录。默认不指定时，输出到图片当前所在目录；指定相对路径时，该路径相对于 ComfyUI 的输出根目录；若设为绝对路径，则必须在输出根目录内部，否则报错；若设为 :inherit:，则复制原始未调整的工作流。
