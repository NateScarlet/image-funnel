<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- 左侧（受光面）渐变 -->
    <linearGradient id="left-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fe9a20" />
      <stop offset="12%" stop-color="#f98d18" />
      <stop offset="25%" stop-color="#f46c11" />
      <stop offset="50%" stop-color="#fa8720" />
      <stop offset="75%" stop-color="#fc8a1e" />
      <stop offset="100%" stop-color="#fe8915" />
    </linearGradient>

    <!-- 右侧（背光面）渐变 -->
    <linearGradient id="right-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f07d14" />
      <stop offset="12%" stop-color="#e46e0e" />
      <stop offset="25%" stop-color="#dc5c08" />
      <stop offset="50%" stop-color="#e87a18" />
      <stop offset="75%" stop-color="#ea7d16" />
      <stop offset="100%" stop-color="#f07a10" />
    </linearGradient>
  </defs>

  <!-- 整体漏斗背景（左侧受光面） -->
  <polygon points="4,18 96,18 49,88" fill="url(#left-grad)" />

  <!-- 右侧阴影面 -->
  <polygon points="55,18 96,18 49,88" fill="url(#right-grad)" />
</svg>
