<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- 几何折纸风格漏斗：三个三角面片构成立体感 -->

  <!-- 右侧深橙色面：底层大三角 -->
  <polygon points="22,28 78,28 50,76" fill="#ea580c" />

  <!-- 左侧中橙色面：覆盖左半部分 -->
  <polygon points="22,28 50,28 50,76" fill="#f97316" />

  <!-- 顶部浅橙色面：折纸高光面 -->
  <polygon points="22,28 50,28 62,46" fill="#fdba74" />
</svg>
