<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- 几何折纸风格漏斗：三个三角面片构成立体感 -->

  <!-- 底层：深橙色面（右侧） -->
  <polygon points="3,17 96,17 49,87" fill="#ea580c" />

  <!-- 中层：中橙色面（左侧） -->
  <polygon points="3,17 63,35 49,87" fill="#f97316" />

  <!-- 顶层：浅橙色面（折纸高光三角） -->
  <polygon points="3,17 96,17 63,35" fill="#fdba74" />
</svg>
