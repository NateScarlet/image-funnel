<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- 左侧（受光面）渐变：稍亮 -->
    <linearGradient id="left-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fe9a20" />
      <stop offset="20%" stop-color="#fc7d14" />
      <stop offset="45%" stop-color="#fa8720" />
      <stop offset="100%" stop-color="#fe8915" />
    </linearGradient>

    <!-- 右侧（背光面）渐变：稍暗 -->
    <linearGradient id="right-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f07d14" />
      <stop offset="20%" stop-color="#e8660c" />
      <stop offset="45%" stop-color="#e87a18" />
      <stop offset="100%" stop-color="#f07a10" />
    </linearGradient>
  </defs>

  <!-- 整体漏斗背景 -->
  <polygon points="3,17 96,17 49,87" fill="url(#left-grad)" />

  <!-- 右侧阴影面 -->
  <polygon points="59,17 96,17 49,87" fill="url(#right-grad)" />
</svg>
