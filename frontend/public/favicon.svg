<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- 漏斗渐变：使用亮丽的橙红到浅橙，突出科技与专业感 -->
    <linearGradient id="funnel-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="60%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fdba74" />
    </linearGradient>

    <!-- 微光投影滤镜，增加立体感 -->
    <filter id="glow-effect" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ea580c" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- 漏斗图标形状：充满整个画布，提高小尺寸可见性 -->
  <path d="M15 25 C15 22, 85 22, 85 25 L65 55 C63 58, 62 61, 62 64 L62 78 C62 81, 59 84, 56 84 L44 84 C41 84, 38 81, 38 78 L38 64 C38 61, 37 58, 35 55 Z"
        fill="url(#funnel-grad)" filter="url(#glow-effect)" />
</svg>
