<!doctype html>
<html lang="zh-CN">
  <head>
    <base href="/" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content"
    />
    <title>ImageFunnel - 图片筛选工具</title>
    <!-- 首屏加载内联样式：在 Vue 挂载前提供美观的加载动画 -->
    <style>
      /* 基础页面重置 */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #0f172a; /* 使用 slate-900 作为暗色背景底色 */
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        overflow: hidden;
      }
      
      /* 载入器容器：全屏绝对居中覆盖，避免因外部 CSS 未加载导致父级高度不足 */
      .app-pre-loader {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #0f172a;
        color: #f1f5f9;
        user-select: none;
        z-index: 9999;
      }
      
      /* 载入器内容区域 */
      .loader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 2rem;
      }
      
      /* 图标发光外壳 */
      .logo-wrapper {
        position: relative;
        margin-bottom: 1.5rem;
        filter: drop-shadow(0 0 25px rgba(249, 115, 22, 0.25)); /* 橙色渐变阴影 */
      }
      
      /* 旋转动画外环 */
      .rotating-ring {
        transform-origin: 50px 50px;
        animation: rotate-ring 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      
      /* 掉落的微粒动画（模拟漏斗筛选图片过程） */
      .falling-dot {
        animation: fall-dot 1.8s cubic-bezier(0.25, 1, 0.5, 1) infinite;
      }
      
      /* 主标题：橙黄色渐变字 */
      .loader-title {
        font-size: 2rem;
        font-weight: 800;
        margin: 0 0 0.5rem 0;
        letter-spacing: 0.05em;
        background: linear-gradient(135deg, #f97316 0%, #fdba74 100%);
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 4px 12px rgba(249, 115, 22, 0.1);
      }
      
      /* 副标题：柔和灰色 */
      .loader-subtitle {
        font-size: 0.875rem;
        color: #94a3b8;
        margin: 0 0 2rem 0;
        font-weight: 400;
        letter-spacing: 0.02em;
      }
      
      /* 进度条轨道 */
      .loader-bar-container {
        width: 160px;
        height: 3px;
        background-color: rgba(249, 115, 22, 0.1);
        border-radius: 9999px;
        overflow: hidden;
        position: relative;
      }
      
      /* 进度条滑动块 */
      .loader-bar {
        width: 60px;
        height: 100%;
        background: linear-gradient(90deg, #f97316, #fdba74);
        border-radius: 9999px;
        position: absolute;
        left: -60px;
        animation: loading-progress 1.6s ease-in-out infinite;
      }

      /* 动画定义 */
      @keyframes rotate-ring {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      @keyframes fall-dot {
        0% {
          transform: translateY(-16px);
          opacity: 0;
        }
        30% {
          opacity: 1;
        }
        70% {
          transform: translateY(16px);
          opacity: 0.2;
        }
        100% {
          transform: translateY(22px);
          opacity: 0;
        }
      }

      @keyframes loading-progress {
        0% {
          left: -60px;
        }
        50% {
          left: 160px;
        }
        100% {
          left: 160px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app" class="min-h-screen bg-primary-900 text-primary-100 isolate">
      <!-- 首屏加载占位 HTML，Vue 挂载后会自动被清理 -->
      <div class="app-pre-loader">
        <div class="loader-content">
          <div class="logo-wrapper">
            <svg class="funnel-logo" viewBox="0 0 100 100" width="80" height="80">
              <defs>
                <linearGradient id="funnel-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#ea580c" />
                  <stop offset="100%" stop-color="#f97316" />
                </linearGradient>
                <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#f97316" />
                  <stop offset="100%" stop-color="#fdba74" />
                </linearGradient>
              </defs>
              <!-- 背景装饰环 -->
              <circle cx="50" cy="50" r="44" fill="none" stroke="rgba(249, 115, 22, 0.12)" stroke-width="2" />
              <!-- 旋转的虚线环 -->
              <circle cx="50" cy="50" r="44" fill="none" stroke="url(#funnel-grad)" stroke-width="2.5" stroke-dasharray="276" stroke-dashoffset="80" class="rotating-ring" />
              <!-- 抽象渐变漏斗结构 -->
              <path d="M30 32 C30 30, 70 30, 70 32 L58 54 C57 56, 56.5 58, 56.5 60 L56.5 70 C56.5 72, 54.5 74, 52.5 74 L47.5 74 C45.5 74, 43.5 72, 43.5 70 L43.5 60 C43.5 58, 43 56, 42 54 Z" fill="url(#glow-grad)" />
              <!-- 坠落的动态微粒 -->
              <circle cx="50" cy="22" r="3.5" fill="#fdba74" class="falling-dot" />
            </svg>
          </div>
          <h1 class="loader-title">ImageFunnel</h1>
          <p class="loader-subtitle">正在准备您的图片筛选工作流...</p>
          <div class="loader-bar-container">
            <div class="loader-bar"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
