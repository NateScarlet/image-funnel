mutation SetDirectoryState($input: SetDirectoryStateInput!) {
  setDirectoryState(input: $input) {
    directory {
      id
      state {
        browse {
          filterBy {
            id
            rating
            label
            query
          }
          filterNoteBy {
            id
            hidden
          }
        }
        updatedAt
      }
    }
    clientMutationId
  }
}
