query notificationChannels($filterBy: NotificationFiltersInput, $first: Int, $after: String) {
  notificationChannels(filterBy: $filterBy, first: $first, after: $after) {
    nodes {
      channel
      unreadCount
      latestNotification {
        ...Notification
      }
    }
    pageInfo {
      hasNextPage
      hasPreviousPage
      startCursor
      endCursor
    }
  }
}
