query BrowseImages(
  $id: ID!
  $filterBy: ImageFiltersInput
  $first: Int
  $after: String
) {
  node(id: $id) {
    id
    ... on Directory {
      images(filterBy: $filterBy, first: $first, after: $after) {
        edges {
          cursor
          node {
            ...Image
          }
        }
        nodes {
          ...Image
        }
        pageInfo {
          hasNextPage
          hasPreviousPage
          startCursor
          endCursor
        }
      }
    }
  }
}
