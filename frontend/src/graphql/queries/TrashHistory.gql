query TrashHistory($first: Int, $after: String, $format: ImageFormat = WEBP) {
  trashHistory(first: $first, after: $after) {
    edges {
      node {
        id
        totalFileCount
        totalFileSize
        trashedAt
        imageCount
        associatedFileCount
        srcRelPath
        message
        coverImage {
          id
          url(width: 256, format: $format)
          width
          height
        }
      }
      cursor
    }
    nodes {
      id
      totalFileCount
      totalFileSize
      trashedAt
      imageCount
      associatedFileCount
      srcRelPath
      message
      coverImage {
        id
        url(width: 256, format: $format)
        width
        height
      }
    }
    pageInfo {
      hasNextPage
      hasPreviousPage
      startCursor
      endCursor
    }
  }
}
