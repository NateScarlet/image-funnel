fragment Session on Session {
  id
  directory {
    ...Directory
  }
  filter {
    rating
  }
  targetKeep
  stats {
    ...SessionStats
  }
  createdAt
  updatedAt
  canCommit
  canUndo
  currentIndex
  currentSize
  currentRound
  currentImage {
    ...Image
  }
  nextImages(count: 10) {
    ...Image
  }
  queueActions
}
