name: release-please
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.REPO_GITHUB_TOKEN }}
  build:
    # chai2010/webp 的 WebP 编码走 cgo：使用原生 Windows runner 上预装的 MSYS2 gcc，
    # 避免从 Linux 交叉编译时 apt 安装 mingw 的不稳定与 cgo 被禁用导致的符号缺失。
    runs-on: windows-latest
    if: always()
    needs:
      - release-please
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Build Frontend
        run: |
          pnpm install
          pnpm run build

      # 原生 Windows runner 预装 MSYS2，定位其 gcc 供 cgo 使用；找不到时直接失败，
      # 避免悄悄退回 CGO_ENABLED=0 导致 webp C 符号未链接。
      - name: Locate C compiler for cgo
        run: |
          if command -v gcc >/dev/null 2>&1; then
            echo "CC=$(command -v gcc)" >> "$GITHUB_ENV"
            exit 0
          fi
          for candidate in \
            "C:/msys64/mingw64/bin/gcc.exe" \
            "C:/msys64/ucrt64/bin/gcc.exe" \
            "C:/msys64/mingw32/bin/gcc.exe" \
            "C:/ProgramData/chocolatey/bin/gcc.exe"; do
            if [ -f "$candidate" ]; then
              echo "CC=$candidate" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "No MSYS2 gcc found; cgo/WebP encoding cannot be built" >&2
          exit 1

      - name: Build Backend (Windows)
        env:
          CGO_ENABLED: "1"
        run: |
          VERSION=${{ needs.release-please.outputs.tag_name }}
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then VERSION="dev"; fi
          echo "Building version: $VERSION"
          go build -ldflags "-X main.version=$VERSION" -o image-funnel.exe ./cmd/server

      - name: Package Windows Release
        if: ${{ needs.release-please.outputs.release_created == 'true' }}
        run: |
          mkdir -p release/dist
          cp -r frontend/dist/* release/dist/
          cp image-funnel.exe release/
          cp scripts/windows-dist/* release/

          cd release
          zip -r ../image-funnel-windows-x64.zip .
          cd ..

      - name: Release
        if: ${{ needs.release-please.outputs.release_created == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{needs.release-please.outputs.tag_name}}
          fail_on_unmatched_files: true
          files: |
            image-funnel-windows-x64.zip
          token: ${{ secrets.REPO_GITHUB_TOKEN }}
